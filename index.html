<!DOCTYPE html>
<html>
<head>
  <title>Line Length Discrimination Task</title>
  <!-- jsPsych core & CSS -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  
  <!-- Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4"></script>

  <style>
    body {
      background-color: black !important;
      color: white !important;
      font-family: Arial, sans-serif;
    }
    .stimulus-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    canvas {
      border: 3px solid #555;
    }
  </style>
</head>
<body></body>
<script>
  const jsPsych = initJsPsych();
  const timeline = [];

  const subject_id = jsPsych.randomization.randomID(10);
  const DATAPIPE_ID = "XHncwobjAXd1"; // <-- Paste your DataPipe ID here

  // Canvas Dimensions
  const canvasWidth = 600;
  const canvasHeight = 450;
  const lineY = canvasHeight / 2;
  const centerX = canvasWidth / 2;
  const tickHeight = 45; 

  // Track trial index within current phase/block
  let practice_trial_counter = 0;

  // Helper Function: Generates Canvas for Fixation Cross
  function generateFixationHTML() {
    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;
    
    // Horizontal segment of fixation cross
    ctx.beginPath();
    ctx.moveTo(centerX - 22, lineY);
    ctx.lineTo(centerX + 22, lineY);
    ctx.stroke();

    // Vertical segment matching tick height and X position
    ctx.beginPath();
    ctx.moveTo(centerX, lineY - (tickHeight / 2));
    ctx.lineTo(centerX, lineY + (tickHeight / 2));
    ctx.stroke();

    const dataURL = canvas.toDataURL();
    return `
      <div class="stimulus-layout">
        <img src="${dataURL}" style="width: ${canvasWidth}px; height: ${canvasHeight}px; border: 3px solid #555;" />
      </div>
    `;
  }

  // Canvas Fixation Trial (0.5 seconds)
  const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: () => generateFixationHTML(),
    choices: "NO_KEYS",
    trial_duration: 500
  };

  // Helper Function: Generates Canvas showing a bisected horizontal line
  function generateLineBisectionHTML(coherence, longer_side) {
    const lineThickness = 6;
    const baseHalfLength = 150;
    
    // Coherence 1.0 = 150px offset (line exists 100% on one side)
    const offsetPixels = Math.round(coherence * baseHalfLength);

    let leftLength, rightLength;
    if (longer_side === 'LEFT') {
      leftLength = baseHalfLength + offsetPixels;
      rightLength = baseHalfLength - offsetPixels;
    } else {
      leftLength = baseHalfLength - offsetPixels;
      rightLength = baseHalfLength + offsetPixels;
    }

    const startX = centerX - leftLength;
    const endX = centerX + rightLength;

    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Main Line
    ctx.strokeStyle = "white";
    ctx.lineWidth = lineThickness;
    ctx.beginPath();
    ctx.moveTo(startX, lineY);
    ctx.lineTo(endX, lineY);
    ctx.stroke();

    // Center Vertical Tick
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(centerX, lineY - (tickHeight / 2));
    ctx.lineTo(centerX, lineY + (tickHeight / 2));
    ctx.stroke();

    const dataURL = canvas.toDataURL();
    return `
      <div class="stimulus-layout">
        <img src="${dataURL}" style="width: ${canvasWidth}px; height: ${canvasHeight}px; border: 3px solid #555;" />
      </div>
    `;
  }

  // ==========================================
  // SECTION A: WELCOME & INSTRUCTIONS
  // ==========================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Welcome to the Experiment</h2>
      <p>In this task, you will see a horizontal line divided into two sections by a vertical mark.</p>
      <p>Your task is to decide which side of the line is longer.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to continue.</p>
    `,
    choices: [' ']
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Task Instructions</h2>
      <p>Judge which segment of the line is longer as quickly and accurately as possible:</p>
      <p style="margin-top: 15px;">
        Press <b>A</b> if the <b>LEFT</b> side is longer.
      </p>
      <p>
        Press <b>L</b> if the <b>RIGHT</b> side is longer.
      </p>
      <br>
      <p>Press <b>SPACEBAR</b> to start the practice phase.</p>
    `,
    choices: [' ']
  });

  // ==========================================
  // SECTION B: PRACTICE PHASE (25 TRIALS)
  // ==========================================
  const practice_conditions = [
    // { coherence: 0.80, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.70, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.60, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.50, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.40, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.30, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.25, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.20, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.25, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.10, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.05, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.05, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.05, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.05, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.05, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.03, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.03, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.03, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.03, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.015, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.015, dominant: 'LEFT',  correct_key: 'a' },
    // { coherence: 0.015, dominant: 'RIGHT', correct_key: 'l' },
    // { coherence: 0.015, dominant: 'RIGHT', correct_key: 'l' },
    { coherence: 0.015, dominant: 'LEFT',  correct_key: 'a' },
    { coherence: 0.015, dominant: 'RIGHT', correct_key: 'l' }
  ];

  const practice_trial = {
    type: jsPsychHtmlKeyboardResponse,
    choices: ['a', 'l'],
    stimulus: () => generateLineBisectionHTML(
      jsPsych.timelineVariable('coherence'), 
      jsPsych.timelineVariable('dominant')
    ),
    on_finish: (data) => {
      practice_trial_counter++;
      const key_pressed = data.response === 'a' ? 'LEFT' : (data.response === 'l' ? 'RIGHT' : 'NONE');
      const is_correct = data.response === jsPsych.timelineVariable('correct_key') ? 1 : 0;

      data.is_task_trial = true; // Data marker for filtering
      data.subject_id = subject_id;
      data.phase = 'practice';
      data.block_number = 0;
      data.trial_number = practice_trial_counter;
      data.coherence = jsPsych.timelineVariable('coherence');
      data.target_side = jsPsych.timelineVariable('dominant');
      data.block_condition = 'PRACTICE';
      data.response_key = key_pressed;
      data.rt = data.rt ? Math.round(data.rt) : null;
      data.correct = is_correct;
    }
  };

  const practice_feedback = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: () => {
      const last_trial = jsPsych.data.get().last(1).values()[0];
      return last_trial.correct === 1 
        ? '<p style="font-size: 36px; color: #00ff00; font-weight: bold;">Correct!</p>' 
        : '<p style="font-size: 36px; color: #ff3333; font-weight: bold;">Incorrect</p>';
    },
    choices: "NO_KEYS",
    trial_duration: 800
  };

  timeline.push({
    timeline: [fixation, practice_trial, practice_feedback],
    timeline_variables: practice_conditions,
    randomize_order: false
  });

  // ==========================================
  // SECTION C: TRANSITION & SPEED/ACCURACY INSTRUCTIONS
  // ==========================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Practice Complete!</h2>
      <p>You are now ready for the main experiment.</p>
      <p>The main experiment consists of <b>10 blocks of 60 trials each</b>.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to continue.</p>
    `,
    choices: [' ']
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Speed vs. Accuracy Condition</h2>
      <p>Before each block begins, a cue screen will display either <b>"SPEED"</b> or <b>"ACCURACY"</b> for 3 seconds.</p>
      <br>
      <p><b>SPEED blocks:</b> Focus on responding as quickly as possible.</p>
      <p><b>ACCURACY blocks:</b> Focus on making as few errors as possible.</p>
      <br>
      <p>During the main experiment, you will no longer receive feedback after trials.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to start the main experiment.</p>
    `,
    choices: [' ']
  });

  // ==========================================
  // SECTION D: MAIN EXPERIMENT (10 BLOCKS x 60 TRIALS)
  // ==========================================
  const main_conditions = [
    { coherence: 0.75, dominant: 'LEFT',  correct_key: 'a' },
    { coherence: 0.75, dominant: 'RIGHT', correct_key: 'l' },
    { coherence: 0.03, dominant: 'LEFT',  correct_key: 'a' },
    { coherence: 0.03, dominant: 'RIGHT', correct_key: 'l' },
    { coherence: 0.015, dominant: 'LEFT',  correct_key: 'a' },
    { coherence: 0.015, dominant: 'RIGHT', correct_key: 'l' }
  ];

  const block_types = jsPsych.randomization.shuffle([
    'SPEED', 'SPEED', 'SPEED', 'SPEED', 'SPEED',
    'ACCURACY', 'ACCURACY', 'ACCURACY', 'ACCURACY', 'ACCURACY'
  ]);

  for (let block_idx = 0; block_idx < 1; block_idx++) {
    const current_block_type = block_types[block_idx];
    let main_trial_counter = 0;

    const block_cue = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const color = current_block_type === 'SPEED' ? '#ff3333' : '#3399ff';
        return `<h1 style="font-size: 70px; color: ${color}; font-weight: bold;">${current_block_type}</h1>`;
      },
      choices: "NO_KEYS",
      trial_duration: 3000
    };

    const main_trial = {
      type: jsPsychHtmlKeyboardResponse,
      choices: ['a', 'l'],
      stimulus: () => generateLineBisectionHTML(
        jsPsych.timelineVariable('coherence'), 
        jsPsych.timelineVariable('dominant')
      ),
      on_finish: (data) => {
        main_trial_counter++;
        const key_pressed = data.response === 'a' ? 'LEFT' : (data.response === 'l' ? 'RIGHT' : 'NONE');
        const is_correct = data.response === jsPsych.timelineVariable('correct_key') ? 1 : 0;

        data.is_task_trial = true;
        data.subject_id = subject_id;
        data.phase = 'main';
        data.block_number = block_idx + 1;
        data.trial_number = main_trial_counter;
        data.coherence = jsPsych.timelineVariable('coherence');
        data.target_side = jsPsych.timelineVariable('dominant');
        data.block_condition = current_block_type;
        data.response_key = key_pressed;
        data.rt = data.rt ? Math.round(data.rt) : null;
        data.correct = is_correct;
      }
    };

    const block_timeline = {
      timeline: [fixation, main_trial],
      timeline_variables: main_conditions,
      randomize_order: true,
      repetitions: 1
    };

    const break_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <h2>Block ${block_idx + 1} of 10 Complete</h2>
        <p>Take a brief rest.</p>
        <br>
        <p>Press <b>SPACEBAR</b> when you are ready to continue to the next block.</p>
      `,
      choices: [' ']
    };

    timeline.push(block_cue, block_timeline);
    if (block_idx < 9) {
      timeline.push(break_screen);
    }
  }

  // ==========================================
  // SECTION E: SAFE & CLEAN DATAPIPE SAVE
  // ==========================================
  const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
  const unique_filename = `${subject_id}_${timestamp}_line_data.csv`;

  // Robust function to generate clean CSV text without triggering DataPipe payload bugs
  function buildCleanCSV() {
    // 1. Get all trials marked as task trials
    const task_trials = jsPsych.data.get().filter({ is_task_trial: true }).values();
    
    // 2. CSV Header
    const headers = [
      "subject_id",
      "phase",
      "block_number",
      "trial_number",
      "coherence",
      "target_side",
      "block_condition",
      "response_key",
      "rt",
      "correct"
    ];

    let csv_rows = [headers.join(",")];

    // 3. Format each trial row
    task_trials.forEach(trial => {
      const row = [
        trial.subject_id ?? "",
        trial.phase ?? "",
        trial.block_number ?? 0,
        trial.trial_number ?? 0,
        trial.coherence ?? "",
        trial.target_side ?? "",
        trial.block_condition ?? "",
        trial.response_key ?? "NONE",
        trial.rt ?? "",
        trial.correct ?? 0
      ];
      csv_rows.push(row.join(","));
    });

    return csv_rows.join("\n");
  }

  timeline.push({
    type: jsPsychPipe,
    action: "save",
    experiment_id: DATAPIPE_ID,
    filename: unique_filename,
    data_string: buildCleanCSV, // Pass clean function reference directly
    on_finish: (data) => {
      console.log("DataPipe response:", data);
      if (!data.success) {
        console.warn("DataPipe online save failed. Downloading backup locally...");
        
        // Local fallback using Blob to ensure participant data is never lost
        const blob = new Blob([buildCleanCSV()], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = unique_filename;
        link.click();
      }
    }
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: () => {
      const last_trial = jsPsych.data.get().last(1).values()[0];
      if (last_trial && last_trial.success) {
        return `
          <h2>Experiment Complete!</h2>
          <p>Your responses have been saved online successfully.</p>
          <p>You can close this browser tab now.</p>
        `;
      } else {
        return `
          <h2>Experiment Complete!</h2>
          <p style="color: #ffaa00;">Note: DataPipe server could not complete online storage.</p>
          <p>Your clean CSV file (<b>${unique_filename}</b>) has been downloaded directly to your Downloads folder.</p>
          <p>You can close this tab now.</p>
        `;
      }
    },
    choices: "NO_KEYS"
  });

  jsPsych.run(timeline);
</script>
</html>
