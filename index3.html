<!DOCTYPE html>
<html>
<head>
  <title>Color Array Discrimination (Orange vs Blue)</title>
  <!-- jsPsych core & CSS -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  
  <!-- Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4"></script>

  <style>
    body {
      background-color: black !important;
      color: white !important;
      font-family: Arial, sans-serif;
    }
    .pixel-canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }
    canvas {
      border: 3px solid #555;
      image-rendering: pixelated;
    }
  </style>
</head>
<body></body>
<script>
  const jsPsych = initJsPsych();
  const timeline = [];

  const subject_id = jsPsych.randomization.randomID(10);
  const filename = `${subject_id}_color_data.csv`;
  const DATAPIPE_ID = "YOUR_DATAPIPE_ID_HERE"; // <-- Paste your DataPipe ID here

  // Shared Fixation Cross (0.5 seconds)
  const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<p style="font-size: 50px; color: white; font-weight: bold;">+</p>',
    choices: "NO_KEYS",
    trial_duration: 500
  };

  // Helper Function: Generates a Canvas showing a grid of Orange vs Blue pixels
  function generatePixelArrayHTML(coherence, dominant_color) {
    const gridSize = 50; 
    const canvasSize = 300;
    const totalPixels = gridSize * gridSize;

    // Proportion of dominant pixels (0.5 = 50/50 chance; 1.0 = 100% dominant)
    const dominantProportion = 0.5 + (coherence / 2);
    const numDominant = Math.round(totalPixels * dominantProportion);
    const numOther = totalPixels - numDominant;

    // Luminance-Matched RGB Pairs for Dark Background
    const COLOR_ORANGE = [255, 119, 0];   // Vibrant Orange
    const COLOR_BLUE   = [0, 136, 255];   // Bright Blue

    const dominantVal = (dominant_color === 'ORANGE') ? COLOR_ORANGE : COLOR_BLUE;
    const otherVal    = (dominant_color === 'ORANGE') ? COLOR_BLUE : COLOR_ORANGE;

    // Build pixel array and shuffle randomly
    let pixels = new Array(numDominant).fill(dominantVal).concat(new Array(numOther).fill(otherVal));
    pixels = jsPsych.randomization.shuffle(pixels);

    // Render Canvas
    const canvas = document.createElement('canvas');
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    const ctx = canvas.getContext('2d');

    const cellSize = canvasSize / gridSize;
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const rgb = pixels[y * gridSize + x];
        ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }

    const dataURL = canvas.toDataURL();
    return `
      <div class="pixel-canvas-container">
        <img src="${dataURL}" style="width: 300px; height: 300px; border: 3px solid #555;" />
      </div>
      <p style="color: white; font-size: 20px; font-weight: bold;">
        Which color is dominant? Press <b>A</b> (<span style="color: #ff7700;">ORANGE</span>) or <b>L</b> (<span style="color: #0088ff;">BLUE</span>)
      </p>
    `;
  }

  // ==========================================
  // SECTION A: WELCOME & INSTRUCTIONS
  // ==========================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Welcome to the Experiment</h2>
      <p>In this task, you will see a patch containing a mixture of <b>ORANGE</b> and <b>BLUE</b> pixels.</p>
      <p>Your task is to decide which color is more dominant in the patch.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to continue.</p>
    `,
    choices: [' ']
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Task Instructions</h2>
      <p>Judge the dominant pixel color as quickly and accurately as possible:</p>
      <p>Press <b>A</b> if there are more <b>ORANGE</b> pixels.</p>
      <p>Press <b>L</b> if there are more <b>BLUE</b> pixels.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to start a short practice phase.</p>
    `,
    choices: [' ']
  });

  // ==========================================
  // SECTION B: PRACTICE PHASE (20 TRIALS)
  // ==========================================
  const practice_conditions = [
    { coherence: 0.70, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.65, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.60, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.55, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.50, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.40, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.35, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.25, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.20, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.15, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.10, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.10, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.10, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.10, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.10, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.05, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.05, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.05, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.05, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.05, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.03, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.03, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.03, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.03, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.03, dominant: 'BLUE',   correct_key: 'l' }
  ];

  const practice_trial = {
    type: jsPsychHtmlKeyboardResponse,
    choices: ['a', 'l'],
    stimulus: () => generatePixelArrayHTML(
      jsPsych.timelineVariable('coherence'), 
      jsPsych.timelineVariable('dominant')
    ),
    data: {
      phase: 'practice',
      coherence: () => jsPsych.timelineVariable('coherence'),
      dominant_color: () => jsPsych.timelineVariable('dominant'),
      correct_key: () => jsPsych.timelineVariable('correct_key')
    }
  };

  const practice_feedback = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: () => {
      const last_trial = jsPsych.data.get().last(1).values()[0];
      const is_correct = last_trial.response === last_trial.correct_key;
      jsPsych.data.get().last(1).addToLast({ correct: is_correct });

      return is_correct 
        ? '<p style="font-size: 36px; color: #00ff00; font-weight: bold;">Correct!</p>' 
        : '<p style="font-size: 36px; color: #ff3333; font-weight: bold;">Incorrect</p>';
    },
    choices: "NO_KEYS",
    trial_duration: 800
  };

  timeline.push({
    timeline: [fixation, practice_trial, practice_feedback],
    timeline_variables: practice_conditions,
    randomize_order: false // Presents practice trials in order from easiest (0.70) to hardest (0.05)
  });

  // ==========================================
  // SECTION C: TRANSITION & SPEED/ACCURACY INSTRUCTIONS
  // ==========================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Practice Complete!</h2>
      <p>You are now ready for the main experiment.</p>
      <p>The main experiment consists of <b>10 blocks of 60 trials each</b>.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to continue.</p>
    `,
    choices: [' ']
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Speed vs. Accuracy Condition</h2>
      <p>Before each block begins, a cue screen will display either <b>"SPEED"</b> or <b>"ACCURACY"</b> for 3 seconds.</p>
      <br>
      <p><b>SPEED blocks:</b> Focus on responding as quickly as possible.</p>
      <p><b>ACCURACY blocks:</b> Focus on making as few errors as possible.</p>
      <br>
      <p>During the main experiment, you will no longer receive feedback after trials.</p>
      <br>
      <p>Press <b>SPACEBAR</b> to start the main experiment.</p>
    `,
    choices: [' ']
  });

  // ==========================================
  // SECTION D: MAIN EXPERIMENT (10 BLOCKS x 60 TRIALS)
  // ==========================================
  const main_conditions = [
    { coherence: 0.65, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.65, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.10, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.10, dominant: 'BLUE',   correct_key: 'l' },
    { coherence: 0.03, dominant: 'ORANGE', correct_key: 'a' },
    { coherence: 0.03, dominant: 'BLUE',   correct_key: 'l' }
  ];

  const block_types = jsPsych.randomization.shuffle([
    'SPEED', 'SPEED', 'SPEED', 'SPEED', 'SPEED',
    'ACCURACY', 'ACCURACY', 'ACCURACY', 'ACCURACY', 'ACCURACY'
  ]);

  for (let block_idx = 0; block_idx < 10; block_idx++) {
    const current_block_type = block_types[block_idx];

    const block_cue = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const color = current_block_type === 'SPEED' ? '#ff3333' : '#3399ff';
        return `<h1 style="font-size: 70px; color: ${color}; font-weight: bold;">${current_block_type}</h1>`;
      },
      choices: "NO_KEYS",
      trial_duration: 3000
    };

    const main_trial = {
      type: jsPsychHtmlKeyboardResponse,
      choices: ['a', 'l'],
      stimulus: () => generatePixelArrayHTML(
        jsPsych.timelineVariable('coherence'), 
        jsPsych.timelineVariable('dominant')
      ),
      on_finish: (data) => {
        data.correct = data.response === jsPsych.timelineVariable('correct_key');
      },
      data: {
        phase: 'main',
        block_number: block_idx + 1,
        block_condition: current_block_type,
        coherence: () => jsPsych.timelineVariable('coherence'),
        dominant_color: () => jsPsych.timelineVariable('dominant'),
        correct_key: () => jsPsych.timelineVariable('correct_key')
      }
    };

    const block_timeline = {
      timeline: [fixation, main_trial],
      timeline_variables: main_conditions,
      randomize_order: true,
      repetitions: 10
    };

    const break_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <h2>Block ${block_idx + 1} of 10 Complete</h2>
        <p>Take a brief rest.</p>
        <br>
        <p>Press <b>SPACEBAR</b> when you are ready to continue to the next block.</p>
      `,
      choices: [' ']
    };

    timeline.push(block_cue, block_timeline);
    if (block_idx < 9) {
      timeline.push(break_screen);
    }
  }

  // ==========================================
  // SECTION E: SAVE DATA & END EXPERIMENT
  // ==========================================
  timeline.push({
    type: jsPsychPipe,
    action: "save",
    experiment_id: DATAPIPE_ID,
    filename: filename,
    data_string: () => jsPsych.data.get().csv()
  }, {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Experiment Complete!</h2>
      <p>Thank you for participating. Your responses have been saved successfully.</p>
      <p>You can close this browser tab now.</p>
    `,
    choices: "NO_KEYS"
  });

  jsPsych.run(timeline);
</script>
</html>
